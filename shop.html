<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Candle Shop</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main>
  <h1>The Candle Shop</h1>
  <p>Open 9 to 5, Tuesday to Saturday.</p>
  <ul class="candles">
    <li>
      <h2>Beeswax pillar</h2>
      <p>Slow burning, with a soft honey scent.</p>
      <p class="price">$18</p>
    </li>
    <li>
      <h2>Lavendar jar</h2>
      <p>For the bedside table.</p>
      <p class="price">$14</p>
    </li>
    <li>
      <h2>Cedar votive</h2>
      <p>Small, woody, burns for an evening.</p>
      <p class="price">$9</p>
    </li>
  </ul>
  <button id="checkout" type="button">Checkout</button>
  <p id="order" role="status"></p>
</main>
<script>
document.getElementById("checkout").addEventListener("click", function () {
  document.getElementById("order").textContent = "Order placed. Thank you!";
});
</script>
</body>
</html>
