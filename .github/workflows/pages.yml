name: Publish the shop

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Write the version into the pages
        run: |
          mkdir -p site
          git archive HEAD | tar -x -C site
          rm -rf site/.github
          python3 - "$(git rev-parse --short=7 HEAD)" "$(git log -1 --format=%s)" <<'PY'
          import html, pathlib, sys
          version = sys.argv[1]
          message = html.escape(sys.argv[2], quote=True)
          for page in pathlib.Path("site").rglob("*.html"):
              text = page.read_text(encoding="utf-8")
              text = text.replace("__VERSION__", version).replace("__MESSAGE__", message)
              page.write_text(text, encoding="utf-8")
          PY
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
